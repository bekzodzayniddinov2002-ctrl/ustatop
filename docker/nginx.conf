server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # React Router BrowserRouter ishlatadi: /ustalar, /buyurtmalar kabi yo'llar
    # serverda fayl sifatida mavjud emas — hammasi index.html ga yo'naltiriladi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash bilan nomlangan assetlar hech qachon o'zgarmaydi — uzoq muddat keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html hech qachon keshlanmasin, aks holda eski build ochilib qoladi
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Asosiy xavfsizlik sarlavhalari
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
