# UstaTop admin panel
#
#   Ishlab chiqish (hot reload):   docker compose up
#   Ishlab chiqarish (nginx):      docker compose --profile prod up --build
#
# Kod o'zgarganda dev konteyner qayta ishga tushishi shart emas — Vite HMR
# o'zgarishni brauzerga darhol yetkazadi.

services:
  # ── Vite dev-server, hot reload bilan ──────────────────────────────────────
  web:
    build:
      context: .
      target: dev
    image: ustatop-dashboard:dev
    container_name: ustatop-web
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      # Manba kodi konteynerga bog'lanadi — tahrir qilgan zahoti HMR ishlaydi
      - .:/app
      # node_modules konteynerniki bo'lib qolsin: host'dagi papka (yoki uning
      # yo'qligi) image ichidagi platformaga mos binarlarni bekor qilmasligi kerak
      - ustatop_node_modules:/app/node_modules
    environment:
      # macOS / Windows'da bind mount inotify hodisalarini yetkazmaydi —
      # Vite fayllarni polling orqali kuzatadi. Linux'da false qilsangiz
      # protsessor yuki kamayadi.
      VITE_POLLING: "${VITE_POLLING:-true}"
      # HMR mijozi brauzerda host portiga ulanishi kerak. DEV_PORT o'zgarsa
      # (masalan 3000:5173), bu ham o'zgaradi va HMR uzilib qolmaydi.
      HMR_PORT: "${DEV_PORT:-5173}"
      NODE_ENV: development
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ── nginx orqali ishlab chiqarish build'i ──────────────────────────────────
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    image: ustatop-dashboard:prod
    container_name: ustatop-web-prod
    ports:
      - "${PROD_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ustatop_node_modules:
